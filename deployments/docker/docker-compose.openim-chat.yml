services:
  openim-chat:
    image: local/openim-chat:dev
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: openim-chat
    restart: always
    entrypoint:
      - bash
      - -c
      - |
        for target in mongo:27017 redis:6379 etcd:2379 openim-server:10002; do
          host="$${target%%:*}"
          port="$${target##*:}"
          until </dev/tcp/$$host/$$port; do
            echo "Waiting for $$target ..."
            sleep 2
          done
        done
        mage start
        tail -f /dev/null
    ports:
      - "10008:10008"
      - "10009:10009"
    volumes:
      - "./config:/openim-chat/config:ro"
      - "../../start-config.yml:/openim-chat/start-config.yml:ro"
      - "./logs:/openim-chat/_output/logs"
    environment:
      TZ: Asia/Shanghai
      HUBMESSAGE_PUBLIC_ORIGIN: ${HUBMESSAGE_PUBLIC_ORIGIN:-}
      HUBMESSAGE_SSO_ENABLED: ${HUBMESSAGE_SSO_ENABLED:-false}
      HUBMESSAGE_SSO_AUTHORIZE_URL: ${HUBMESSAGE_SSO_AUTHORIZE_URL:-}
      HUBMESSAGE_SSO_TOKEN_URL: ${HUBMESSAGE_SSO_TOKEN_URL:-}
      HUBMESSAGE_SSO_USERINFO_URL: ${HUBMESSAGE_SSO_USERINFO_URL:-}
      HUBMESSAGE_SSO_API_BASE_URL: ${HUBMESSAGE_SSO_API_BASE_URL:-}
      HUBMESSAGE_SSO_CLIENT_ID: ${HUBMESSAGE_SSO_CLIENT_ID:-}
      HUBMESSAGE_SSO_CLIENT_SECRET: ${HUBMESSAGE_SSO_CLIENT_SECRET:-}
      HUBMESSAGE_SSO_REDIRECT_URI: ${HUBMESSAGE_SSO_REDIRECT_URI:-}
      HUBMESSAGE_SSO_SCOPE: ${HUBMESSAGE_SSO_SCOPE:-openid}
      HUBMESSAGE_SSO_USER_ID_PREFIX: ${HUBMESSAGE_SSO_USER_ID_PREFIX:-sso}
      HUBMESSAGE_SSO_INSECURE_SKIP_VERIFY: ${HUBMESSAGE_SSO_INSECURE_SKIP_VERIFY:-false}
    healthcheck:
      test: ["CMD-SHELL", "mage check >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - openim

networks:
  openim:
    external: true
    name: docker_openim
